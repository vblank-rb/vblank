name: CI

# Runs on the owner's own Mac, never on GitHub's machines: the tests play every lowering and want
# many cores for a long time, which a hosted runner makes slow and dear. Manual only. Run from the
# Actions tab ("Run workflow") or: gh workflow run ci.yml
#
# The `suite` input picks what is played. `golden` (the default) is `rake test:golden`: the core
# tests, a little of each lowering and 5% of the other test files drawn at random, with the seed
# printed. `all` is `rake test:all`, every test on every lowering, which takes about four and
# three-quarter hours: run it only when the operator has agreed.
#
# Gated to jamescook: this repository is public, and a self-hosted runner executes whatever the
# workflow says directly on that machine. So nothing starts a run but somebody pressing the button
# (no push, pull_request or schedule trigger), and the job is skipped unless jamescook started it
# AND, on a re-run, jamescook pressed re-run: `actor` alone stays the first run's starter, so a
# re-run by somebody else would pass a check of it.
#
# This file is the only gate, and anybody who can push can change it on a branch of their own
# and dispatch that branch. Today jamescook is the repository's only collaborator; give somebody
# write access and this machine is theirs to run code on.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which tests to play: golden (everyday) or all (about 4.75 hours)'
        type: choice
        options:
          - golden
          - all
        default: golden

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The machine keeps its tools in mise. The versions are named here because the checkout's
    # own mise.toml is not in the repository. Everything below is already installed on the
    # machine, the C compiler and libmgba (Homebrew) included, so nothing is downloaded per run.
    shell: /opt/homebrew/bin/mise exec ruby@4.0.10 zig@0.17.0 node@24.6.0 -- bash --noprofile --norc -eo pipefail {0}

jobs:
  test:
    # mac-studio is a label only the Mac Studio's runner carries, so the job never lands on
    # another of jamescook's machines registered here later.
    runs-on: [self-hosted, macOS, mac-studio]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'vblank-rb/vblank' &&
      github.actor == 'jamescook' &&
      github.triggering_actor == 'jamescook'
    # Long enough for the `all` suite; the golden one is far shorter.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      # No committed Gemfile.lock, so a fresh resolve; the gems are already on the machine.
      - name: Bundle install
        run: bundle install

      # The emulator gem's own suite, kept out of `rake test:all`. It goes first because it builds
      # the emulator and takes seconds: an emulator that cannot load fails here, rather than
      # failing every cartridge test of the whole suite one at a time.
      - name: Test the emulator itself
        run: bundle exec rake test:emulator 2>&1 | tee emulator-test.log
        env:
          CI: '1'

      # Every emulator the runs play cartridges in, built up front so a core that cannot build
      # fails here in a minute, not hours into the suite. The Advance's run builds the Super
      # Nintendo, Genesis and PlayStation cores itself, but a clean checkout has none of them
      # built. The PlayStation's Beetle PSX comes from one downloaded archive, built with the tools
      # the machine already has (make, patch, tar and clang), and DOS's DOSBox from two
      # (the core and libretro-common) with the same tools. A second or two when already built.
      - name: Build every emulator core and its C extension
        run: bundle exec rake compile_emulator compile_snes_core compile_genesis_core compile_ps1_core compile_dos_core

      # The suite named by the `suite` input, passed through the environment so the input is never
      # written into the script. A whole run takes the machine to itself, so this waits while a
      # run in another checkout on the same Mac finishes.
      - name: Run tests
        run: bundle exec rake "test:${SUITE}" 2>&1 | tee test-output.log
        env:
          CI: '1'
          SUITE: ${{ inputs.suite }}

      # Build every example and compare what it emits against tools/emitted_baseline.json.
      # Deliberate growth is accepted with `rake emitted:record` and a commit of the diff.
      - name: Check emitted code against the baseline
        run: bundle exec rake emitted:check 2>&1 | tee emitted-check.log
        env:
          CI: '1'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-output.log
            emulator-test.log
            emitted-check.log
          retention-days: 7
